name: Docker Compose Smoke Test

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Docker Compose - Full Stack Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=ecobytemetrics
          POSTGRES_PASSWORD=ecobytemetrics_ci
          POSTGRES_DATABASE=ecobytemetrics_test
          POSTGRES_PORT_CONTEINER=5433
          PORT=3000
          PORT_CONTEINER=3000
          API_METRIC=http://127.0.0.1:9
          API_CARBON=http://127.0.0.1:9
          JWT_SECRET=ci-only-secret-not-used-outside-tests-2026
          JWT_EXPIRES_IN=1h
          FRONT_PORT=8080
          PGPORT=80
          EOF

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet

      - name: Build and start the complete application
        run: docker compose -f compose.yaml up --build -d

      - name: Verify backend, frontend and reverse proxy
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health | grep -q '"status":"ok' &&
               curl --fail --silent http://127.0.0.1:8080/ > /dev/null &&
               curl --fail --silent http://127.0.0.1:8080/backend/health | grep -q '"status":"ok'; then
              echo "Backend, frontend and frontend-to-backend proxy are responding."
              exit 0
            fi
            sleep 2
          done

          echo "The application stack did not become healthy. Compose status:"
          docker compose -f compose.yaml ps
          echo "Compose logs:"
          docker compose -f compose.yaml logs --no-color
          exit 1

      - name: Stop containers and remove temporary volumes
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
